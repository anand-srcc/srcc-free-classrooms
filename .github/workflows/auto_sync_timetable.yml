name: Auto-Sync SRCC Timetable & Free Classrooms

on:
  schedule:
    # Runs automatically every 4 hours Monday to Saturday (college active days)
    # Minute 20 avoids congested :00 peak runner load times
    - cron: '20 */4 * * 1-6'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web interface

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Timetable Auto-Sync & Change Detector
        id: run_sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python auto_sync_timetable.py

      - name: Commit & Push changes (Triggers Netlify Auto-Deploy)
        run: |
          git config --global user.name "SRCC-Timetable-Bot"
          git config --global user.email "bot@srcc-classroom-finder.internal"
          git add web_app/ SRCC_Free_Classrooms_Timetable.xlsx
          if git diff --staged --quiet; then
            echo "No changes detected in web_app or Excel."
          else
            git commit -m "🤖 [Automated] Fresh SRCC Timetable sync & verification"
            git push
          fi

      - name: Trigger Netlify Deploy Hook (if configured)
        if: env.NETLIFY_BUILD_HOOK != ''
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          curl -s -X POST -d '{}' "$NETLIFY_BUILD_HOOK"

