name: Auto-Sync SRCC Faculty Leaves

on:
  schedule:
    # Runs every 30 mins during college morning hours (8:45 AM - 1:45 PM IST, Mon-Sat)
    # Uses minutes :15 and :45 to avoid congested :00 and :30 GitHub runner peaks
    - cron: '15,45 3-8 * * 1-6'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web or mobile app

permissions:
  contents: write

jobs:
  sync_leaves:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Live Faculty Leave Synchronizer
        env:
          SRCC_ROLL: ${{ secrets.SRCC_ROLL || '25BC070' }}
          SRCC_PASS: ${{ secrets.SRCC_PASS || 'RFSCH250900681809' }}
        run: |
          python sync_leaves.py

      - name: Commit and push updated leaves
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_app/faculty_leaves.json web_app/faculty_leaves.js
          if git diff --staged --quiet; then
            echo "No changes in faculty leaves."
          else
            git commit -m "🏖️ [Automated] Sync live faculty leaves from studentassistsrcc.app"
            git push
          fi

      - name: Trigger Netlify Deploy Hook (if configured)
        if: env.NETLIFY_BUILD_HOOK != ''
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          curl -s -X POST -d '{}' "$NETLIFY_BUILD_HOOK"

