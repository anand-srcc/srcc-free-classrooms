name: Auto-Sync SRCC Faculty Leaves

on:
  schedule:
    # Runs every 30 mins during college morning hours (8:45 AM - 1:45 PM IST, Mon-Sat)
    # Uses minutes :15 and :45 to avoid congested :00 and :30 GitHub runner peaks
    - cron: '15,45 3-8 * * 1-6'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web or mobile app

permissions:
  contents: write

jobs:
  sync_leaves:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install Xvfb (Virtual Display for Turnstile Bypass)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Live Faculty Leave Synchronizer
        env:
          SRCC_ROLL: ${{ secrets.SRCC_ROLL }}
          SRCC_PASS: ${{ secrets.SRCC_PASS }}
          PLAYWRIGHT_STATE: ${{ secrets.PLAYWRIGHT_STATE }}
        run: |
          xvfb-run --auto-servernum python sync_leaves.py --headed

      - name: Dispatch Closed-Browser Web Push Notifications (Hourly Device Alerts)
        run: |
          python dispatch_push_notifications.py

      - name: Commit and push updated leaves
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_app/faculty_leaves.json web_app/faculty_leaves.js web_app/widget_feed.json
          if git diff --staged --quiet; then
            echo "No changes in faculty leaves."
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "🏖️ [Automated] Sync live faculty leaves (Dual StudentAssist + Cloud DB)"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Netlify Deploy Hook (if configured and changed)
        if: steps.commit_step.outputs.committed == 'true' && env.NETLIFY_BUILD_HOOK != ''
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          curl -s -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
