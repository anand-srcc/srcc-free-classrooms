    <!-- iOS ignores the manifest's icons and uses this one, and it does NOT
         support transparency: it composites the alpha channel onto BLACK. The
         PWA icons are 23% transparent (transparent corners around the crest),
         so pointing this at icon-192.png produced a black square with the crest
         floating in it on every iPhone that added the app to its home screen.
         apple-touch-icon.png is the same crest flattened onto the white the
         maskable icons already use, at the 180x180 iOS actually asks for. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- Outfit used to be pulled in by an @import at the top of index.css, so the
         browser could not even discover it until the 92KB stylesheet had arrived
         and parsed - then it still needed a cold DNS+TCP+TLS handshake before it
         would paint anything. Declaring it here (with the handshake warmed by the
         preconnects) moves that work off the critical path. Cinzel is NOT here on
         purpose: it is used by one heading in MaintenanceGate, which loads it
         itself when it actually renders. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

        border: 3px solid rgb(255 255 255 / 12%);
        border-top-color: #fceb08;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.05);
        }
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
